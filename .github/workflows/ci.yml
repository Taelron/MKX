name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - run: make test

  # The golden-oracle guards get their own job rather than a step in the matrix
  # above, for two reasons. It runs on ubuntu only: the sabotage script uses GNU
  # sed (`sed -i` with no argument, and `\n` in a replacement), which the BSD sed
  # on macOS runners rejects — the job would fail there for a reason that has
  # nothing to do with the guards. And as a separate job it runs concurrently
  # with the matrix, so the slowest check in CI does not extend the critical path.
  #
  # Nothing in `go test ./...` touches the guard script, so unlike `make verify`
  # this proof is not transitive. If it does not run here, it runs only when
  # someone remembers.
  #
  # The same is true of every sabotage script, so they share this job rather
  # than each getting one: they are all ubuntu-only, all off the critical path,
  # and all proving the same class of claim — that a test which is supposed to
  # catch something actually goes red when that something is broken.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make verify-guards
      # TAE-61's batch guards. The deliverable there is behaviour that must not
      # happen — no pasted or replayed input may fire a checkout, a pull or a
      # target run — so a green suite shows only that nothing tripped. This
      # removes each of handleKey's two guards in a throwaway copy and fails
      # unless the batch tests go red by name.
      - run: make verify-batch-guard
      # TAE-62's read bound, the same class of claim: the deliverable is a git
      # read that does not hang, which a green suite cannot demonstrate. This
      # removes cmd.WaitDelay in a throwaway copy and fails unless the
      # descendant-holds-the-pipe case goes red while the case that does not
      # need the bound stays green.
      - run: make verify-waitdelay-guard
      # TAE-60's hint bar fit, again the same class of claim: the deliverable is
      # a bar that does not wrap, which a green suite cannot demonstrate. This
      # reverts renderHintBar to the naive width in a throwaway copy and fails
      # unless the width table goes red at 79, 60 and 40 while staying green at
      # 80 — where the bar fits even unfitted, so a sabotage that reddened it
      # too would mean the copy was broken rather than the mechanism proven.
      - run: make verify-hintbar-guard
